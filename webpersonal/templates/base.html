{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lulii</title>
    <link rel="icon" type="image/png" href="{% static 'assets/icon.png' %}">

        
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header id="header">
        <nav id="navbar" class="navbar navbar-expand-lg">
            <div class="container">
                <a href="" class="navbar-brand logo">Lulii (˶˃ ᵕ ˂˶) ୭ ᵎᵎ 🧁</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links">
                    {% block nav_elements %}{% endblock %}
                </ul>

                <button id="theme-toggle" aria-label="Cambiar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid contenedor-out">
        <div class="container-fluid contenedor-in">
            {% block content %}{% endblock %}
            <footer class="mt-2" id="footer">
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <p class="mb-0 texto-footer"><a href="{% url 'portfolio:index' %}">homepage</a></p>
                    <span class="texto-footer">|</span>
                    <p class="mb-0 texto-footer"><a href="{% url 'blog:index' %}">blog</a></p>
                    <span class="texto-footer">|</span>
                    <p class="mb-0 texto-footer"><a href="https://ar.pinterest.com/pin/823103269442908254/" target="_blank">creds for inspo</a></p>
                </div>
            </footer>
        </div>

    <script>
            const themeToggle = document.getElementById('theme-toggle');
            const icon = themeToggle.querySelector('i');

            function aplicarTema(tema) {
            if (tema === 'oscuro') {
                document.body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                document.body.classList.remove('dark-mode');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
            }

            const temaGuardado = localStorage.getItem('tema') || 'claro';
            aplicarTema(temaGuardado);

            themeToggle.addEventListener('click', () => {
            const nuevoTema = document.body.classList.contains('dark-mode') ? 'claro' : 'oscuro';
            aplicarTema(nuevoTema);
            localStorage.setItem('tema', nuevoTema);
            });

            const formContacto = document.getElementById('form-contacto');
            formContacto.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('¡Gracias por tu mensaje! Te voy a responder pronto.');
            formContacto.reset();
            });
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
